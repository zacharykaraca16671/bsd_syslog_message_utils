[project]
name = "bsd-syslog-message-utils"
version = "0.1.0"
description = "Decodes BSD syslog (RFC 3164) messages into structured fields like priority, facility, severity, and timestamp."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
